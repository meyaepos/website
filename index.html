<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錦葳健康美學中心 - 韓系極簡</title>
    <!-- 載入 Google 字體 Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- 載入樣式表 -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- 導覽列 -->
    <header class="site-header">
        <div class="logo">
            <!-- 稍後可替換為 /assets/images/logo.png -->
            <h1>Brand Logo</h1>
        </div>
        <nav id="main-nav">
            <!-- JS 動態產生導覽列 -->
        </nav>
        <div class="cart-icon">
            🛒 購物車
        </div>
    </header>

    <!-- 品牌形象橫幅 -->
    <section class="hero-banner">
        <!-- 稍後可放入背景圖或 /assets/images/hero.jpg -->
        <h2>極簡．優雅．新生活</h2>
    </section>

    <!-- 商品列表區塊 -->
    <main class="container">
        <div id="product-grid" class="grid-layout">
            <!-- 預設顯示 4 個載入中骨架屏 -->
            <div class="product-card loading-state"></div>
            <div class="product-card loading-state"></div>
            <div class="product-card loading-state"></div>
            <div class="product-card loading-state"></div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="site-footer">
        <p id="free-shipping-text">全館滿額享免運</p>
        <p>&copy; 2026 Brand Name. All rights reserved.</p>
    </footer>

    <!-- 載入 JS 邏輯 -->
    <script src="./js/config.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
