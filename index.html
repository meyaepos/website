<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>is Meya - Minimal and Chic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="loading-state"> <!-- 預設載入狀態 -->
    
    <!-- 導覽列 -->
    <header class="header">
        <div class="logo">is Meya</div>
        <nav class="nav-links">
            <a href="#">新品上市</a>
            <a href="#">所有商品</a>
            <a href="#">聯絡我們</a>
        </nav>
        <!-- 購物車圖示 (受 GAS 設定控制顯示/隱藏) -->
        <div class="cart-icon">
            🛒 <span class="cart-text">Cart</span>
        </div>
    </header>

    <!-- 骨架屏 (載入中顯示) -->
    <div id="loader" class="loader">
        <p>優雅載入中，請稍候...</p>
    </div>

    <!-- 主內容區 -->
    <main id="app-content" style="display: none;">
        <!-- 品牌視覺 -->
        <section class="hero">
            <h1>點亮生活裡的每個細節</h1>
            <p>Minimal and chic Korean style</p>
        </section>

        <!-- 商品列表 -->
        <section class="curated-jewelry">
            <h2>精選飾品 Curated Jewelry</h2>
            <div id="product-grid" class="grid-container">
                <!-- JS 將在此動態注入商品卡片 -->
            </div>
        </section>
    </main>

    <!-- 頁尾 -->
    <footer class="footer">
        <p id="free-shipping-text">全館滿 NT$XXXX 享免運服務。</p>
        <p>Copyright © 2026 is Meya. All rights reserved.</p>
    </footer>

    <!-- 核心邏輯 -->
    <script src="app.js"></script>
</body>
</html>
